<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập ngữ pháp BJT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --ink:#16224a; --ink-2:#4a5578; --muted:#7a839e;
  --line:#c9cedd; --line-2:#e3e6ef; --accent:#c0442a; --accent-ink:#fff;
  --ok:#1f8a4c; --ok-bg:#e6f5ec; --bad:#c8352b; --bad-bg:#fdecea; --sel-bg:#eef1fa;
  --shadow:0 6px 24px rgba(22,34,74,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11152a; --card:#1a2038; --ink:#e7eaf6; --ink-2:#b8bfd9; --muted:#8a93b3;
    --line:#3a4364; --line-2:#2a3150; --accent:#e0664a; --accent-ink:#fff;
    --ok:#4cc27e; --ok-bg:#163527; --bad:#f07468; --bad-bg:#3a1d1f; --sel-bg:#242c4c;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#11152a; --card:#1a2038; --ink:#e7eaf6; --ink-2:#b8bfd9; --muted:#8a93b3;
  --line:#3a4364; --line-2:#2a3150; --accent:#e0664a; --accent-ink:#fff;
  --ok:#4cc27e; --ok-bg:#163527; --bad:#f07468; --bad-bg:#3a1d1f; --sel-bg:#242c4c;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.jp{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:18px 24px}
.back{background:none;border:0;padding:6px;border-radius:8px;display:flex}
.back:hover{background:var(--line-2)}
.top h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.badge{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;padding:3px 12px;border-radius:999px}
.top .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--ink-2)}

.wrap{max-width:1200px;margin:0 auto;padding:0 16px 140px}
.col{max-width:840px;margin:0 auto}

/* setup */
.panel{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:24px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.lchip{border:1.5px solid var(--line);background:none;border-radius:12px;padding:8px 4px 6px;text-align:center;position:relative}
.lchip b{display:block;font-size:15px}
.lchip small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.lchip .bar{height:3px;border-radius:2px;background:var(--line-2);margin:5px 6px 0;overflow:hidden}
.lchip .bar i{display:block;height:100%;background:var(--ok)}
.lchip.on{border-color:var(--ink);background:var(--sel-bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-size:14px}
.pill.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mini{border:0;background:none;color:var(--ink-2);text-decoration:underline;font-size:13px;padding:4px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tcard{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:none;text-align:left}
.tcard.on{border-color:var(--ink);background:var(--sel-bg)}
.tcard b{display:block;font-size:14.5px}
.tcard span{font-size:12.5px;color:var(--muted)}
.start{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:14px 34px;font-weight:700;font-size:17px;background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.stat{color:var(--ink-2);font-size:14px}
.stat b{color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}

/* quiz */
.nav{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:thin}
.dot{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink-2);background:none;font-weight:600;font-size:17px}
.dot.cur{border-width:3.5px;border-color:var(--ink)}
.dot.ans{background:var(--sel-bg)}
.dot.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.dot.cur.ok{border-color:var(--ok)} .dot.cur.bad{border-color:var(--bad)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.qhead .qn{font-size:21px;font-weight:700}
.timer{display:flex;align-items:center;gap:6px;font-weight:600;font-size:20px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qtype{color:var(--muted);font-size:14.5px;margin:8px 0 14px;letter-spacing:.02em}
.qcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px 28px 26px}
.qcard .ask{font-weight:600;color:var(--ink-2);font-size:15.5px;margin-bottom:12px}
.sent{font-size:25px;line-height:1.75}
.sent u{text-decoration-thickness:2.5px;text-underline-offset:5px;font-weight:700}
.blank{display:inline-block;min-width:4.2em;border-bottom:2.5px solid var(--ink);margin:0 .2em;text-align:center}
.bigword{font-size:40px;font-weight:700;letter-spacing:.02em}
.bigvi{font-size:22px;font-weight:600;line-height:1.5}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.speak{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--ink-2);margin-left:8px;vertical-align:middle}
.opts{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.opt{display:flex;align-items:center;gap:22px;border:1.5px solid var(--ink-2);border-radius:16px;background:var(--card);padding:18px 24px;text-align:left;min-height:84px;transition:background .12s,border-color .12s}
.opt:hover:not(:disabled){background:var(--sel-bg)}
.opt .n{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink-2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px}
.opt .t{font-size:24px;line-height:1.4}
.opt .t.vi{font-size:18px;font-family:"Be Vietnam Pro",sans-serif}
.opt.sel{border-color:var(--ink);border-width:2.5px;background:var(--sel-bg)}
.opt.sel .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt.ok{border-color:var(--ok);border-width:2.5px;background:var(--ok-bg)}
.opt.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);border-width:2.5px;background:var(--bad-bg)}
.opt.bad .n{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.explain{margin-top:18px;background:var(--card);border-radius:18px;border-left:5px solid var(--ok);padding:16px 22px;box-shadow:var(--shadow)}
.explain.wrong{border-left-color:var(--bad)}
.explain .w{font-size:22px;font-weight:700}
.explain .w small{font-size:15px;font-weight:500;color:var(--ink-2);margin-left:8px}
.explain .m{margin:6px 0 2px;font-size:15.5px;line-height:1.55}
.explain .en{color:var(--muted);font-size:13px}
.explain .ex{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.explain .ex .j{font-size:17px;line-height:1.6}
.explain .ex .v{font-size:14px;color:var(--ink-2);line-height:1.5}

.bottom{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
.bottom .in{pointer-events:auto;width:100%;max-width:872px;background:var(--bg);padding:14px 16px 18px;display:flex;gap:18px;align-items:center;box-shadow:0 -8px 24px rgba(22,34,74,.06)}
.bottom .in .btn{flex:1;padding:15px}
.bottom .cnt{font-size:22px;font-weight:600;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}

/* results */
.score{display:flex;align-items:center;gap:28px;flex-wrap:wrap}
.ring{width:130px;height:130px}
.score h2{font-size:28px;margin:0}
.score p{margin:6px 0 0;color:var(--ink-2)}
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border:1px solid var(--line-2);border-radius:14px;padding:12px 14px}
.ritem .mk{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.ritem .mk.ok{background:var(--ok)} .ritem .mk.bad{background:var(--bad)}
.ritem .w{font-size:19px;font-weight:700}
.ritem .w small{font-weight:500;color:var(--ink-2);font-size:14px;margin-left:6px}
.ritem .m{font-size:14px;color:var(--ink-2);margin-top:2px}
.ritem .yours{font-size:13px;color:var(--bad);margin-top:4px}
.filters{display:flex;gap:8px;margin-bottom:12px}

@media (max-width:640px){
  .top{padding:14px 16px}
  .top h1{font-size:20px}
  .dot{width:42px;height:42px;font-size:15px}
  .qcard{padding:18px 18px 20px}
  .sent{font-size:20px}
  .bigword{font-size:32px}
  .opt{padding:14px 16px;gap:14px;min-height:64px}
  .opt .n{width:36px;height:36px;font-size:15px}
  .opt .t{font-size:20px}
  .opt .t.vi{font-size:16px}
  .bottom .in .btn{padding:13px;font-size:15px}
  .bottom .cnt{font-size:17px;min-width:50px}
}
.lessons.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.sent.sub{font-size:18px;margin-top:8px;color:var(--ink-2)}
.sent s, .explain s{text-decoration-color:var(--bad);text-decoration-thickness:2px}
.opt .t.long{font-size:18px}
.ctx{color:var(--muted);font-size:14px;margin-bottom:8px}
.dlg{display:flex;flex-direction:column;gap:12px}
.ln{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.ln .spk{width:28px;height:28px;border-radius:50%;background:var(--line-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-top:4px}
.ln .jp{font-size:20px;line-height:1.7}
.ln.focus .jp{font-weight:500}
.ln .tr{font-size:14px;color:var(--ink-2);line-height:1.5;margin-top:2px}
.explain .ln .jp{font-size:17px}
mark{background:none;color:inherit;font-weight:700;text-decoration:underline;text-decoration-thickness:2.5px;text-underline-offset:5px;text-decoration-color:var(--ok)}
.kt{border-collapse:collapse;width:100%;margin-top:10px;font-size:16px}
.kt th{text-align:left;font-weight:600;color:var(--ink-2);padding:8px 12px 8px 0;width:120px;vertical-align:top;font-size:14px}
.kt th small{font-weight:400;color:var(--muted)}
.kt td{padding:8px 0;border-top:1px solid var(--line-2);line-height:1.9}
.kt tr:first-child td{border-top:0}
.ritem{cursor:pointer}
@media (max-width:640px){ .ln .jp{font-size:17px} .opt .t.long{font-size:15px} }
.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

</style>
<script>try{const t=localStorage.getItem('bjtvocab:theme');if(t)document.documentElement.dataset.theme=JSON.parse(t);}catch(e){}</script>
</head>
<body>
<header class="top">
  <button class="back" id="backBtn" title="Quay lại" aria-label="Quay lại">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <h1 id="title"></h1>
  <span class="badge">BJT</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="themeBtn" title="Đổi giao diện sáng/tối">◐</button>
</header>
<main class="wrap">
  <section id="setup" class="col">
    <div class="panel">
      <h2 id="groupTitle"></h2>
      <p class="sub" id="groupSub"></p>
      <div class="row" style="margin-bottom:12px" id="quick"></div>
      <div class="lessons" id="lessons"></div>
    </div>
    <div class="panel">
      <h2>Dạng câu hỏi</h2>
      <p class="sub">Trộn ngẫu nhiên các dạng đã bật.</p>
      <div class="types" id="types"></div>
    </div>
    <div class="panel">
      <h2>Cách chọn câu</h2>
      <p class="sub">“Ưu tiên câu yếu” chọn trước các mục chưa gặp hoặc hay làm sai.</p>
      <div class="row" id="modes"></div>
      <div class="row" style="margin-top:16px">
        <label class="toggle"><input type="checkbox" id="instant"> Hiện đáp án ngay sau khi chọn</label>
      </div>
    </div>
    <div class="panel start">
      <div class="stat" id="poolStat"></div>
      <button class="btn" id="startBtn">Bắt đầu</button>
    </div>
    <div class="row" style="justify-content:flex-end"><button class="mini" id="resetBtn">Xoá lịch sử ôn tập phần này</button></div>
  </section>
  <section id="quiz" class="col hidden">
    <div class="nav" id="nav"></div>
    <div class="qhead">
      <div class="qn" id="qn"></div>
      <div class="timer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M10 2h4M19 5l1.5-1.5"/></svg><span id="timer">00:00</span></div>
    </div>
    <div class="qtype" id="qtype"></div>
    <div class="qcard"><div class="ask" id="ask"></div><div id="stem"></div></div>
    <div class="opts" id="opts"></div>
    <div id="explain"></div>
  </section>
  <section id="result" class="col hidden">
    <div class="panel score" id="scoreBox"></div>
    <div class="panel"><div class="filters" id="rfilters"></div><div class="rlist" id="rlist"></div></div>
    <div class="row" style="gap:12px">
      <button class="btn" id="retryWrong">Ôn lại câu sai</button>
      <button class="btn ghost" id="newRound">Làm lượt mới</button>
      <button class="btn ghost" id="toSetup">Đổi phần ôn</button>
    </div>
  </section>
</main>
<div class="bottom hidden" id="bottom"><div class="in">
  <button class="btn ghost" id="prevBtn">‹&nbsp; Prev</button>
  <div class="cnt" id="cnt"></div>
  <button class="btn" id="nextBtn">Next &nbsp;›</button>
</div></div>
<script>
const MODULE = 'grammar';
const DATA = [{"id":"g1","no":1,"p":"（できれば）～ていただきたいんですが","ctx":[],"lines":[["A","先日お願いした見積もりの件なんですが、できれば、今日中に送っていただきたいんですが……。","Về bảng báo giá hôm trước tôi có nhờ, nếu được thì mong anh/chị gửi giúp tôi trong ngày hôm nay với ạ..."],["B","承知いたしました。","Vâng, tôi rõ rồi ạ."]],"hit":[0,[[30,41]]],"au":["t/8af097db0363","t/d6f63de5f5c5"]},{"id":"g2","no":2,"p":"～て以来","ctx":[],"lines":[["A","谷山さんは、ずっと営業ですか。","Anh Taniyama làm mảng kinh doanh suốt từ trước tới giờ à?"],["B","はい。入社して以来、営業の仕事をしております。","Vâng. Kể từ khi vào công ty đến nay, tôi vẫn luôn phụ trách công việc kinh doanh."]],"hit":[1,[[6,9]]],"au":["t/56fed42cf3d3","t/57d114b48a65"]},{"id":"g3","no":3,"p":"～なんか","ctx":[],"lines":[["A","私の結婚式でスピーチをお願いしたいんだけど。引き受けてくれない？","Tôi muốn nhờ cậu phát biểu trong đám cưới của tôi, cậu nhận lời nhé?"],["B","えー、私なんか、だめだめ。もっと日本語が上手な人に頼んで。 お願い。","Hả, người như tôi thì sao làm được. Cậu nhờ ai nói tiếng Nhật giỏi hơn đi, xin đấy."],["A","うん、わかった。","Ừ, tôi biết rồi."]],"hit":[1,[[4,7]]],"au":["t/6dfe29172fae","t/515fa06099de","t/aace81427457"]},{"id":"g4","no":4,"p":"～さえ…ば","ctx":[],"lines":[["A","この商品は非常食として、開発されました。水さえあれば、温かいご飯がすぐ食べられます。","Sản phẩm này được phát triển để dùng là món ăn cho những lúc khẩn cấp. Chỉ cần có nước là có thể ăn được cơm nóng ngay."],["B","それは便利ですね。","Tiện lợi quá nhỉ."]],"hit":[0,[[21,23],[25,26]]],"au":["t/1446333664ea","t/3294a860bba8"]},{"id":"g5","no":5,"p":"～次第","ctx":[],"lines":[["A","先生、私は試験に合格できるでしょうか。","Thưa thầy/cô, liệu em có đỗ kỳ thi không ạ?"],["B","それは、あなたの努力次第ですね。","Điều đó còn tùy thuộc vào sự nỗ lực của em đấy."]],"hit":[1,[[10,12]]],"au":["t/acc7cba6795f","t/1bf8d88e7910"]},{"id":"g6","no":6,"p":"～でも","ctx":[],"lines":[["A","課長、ちょっとご相談があるんですが。","Trưởng phòng, tôi có chút chuyện muốn trao đổi ạ."],["B","そう。じゃあ、あっちでお茶でも飲みながら話しましょうか。","Thế à. Vậy chúng ta ra đằng kia vừa uống chút trà vừa nói chuyện nhé."],["A","はい。","Vâng ạ."]],"hit":[1,[[13,15]]],"au":["t/a28828638af2","t/98269b986e83","t/8b9236cd4b86"]},{"id":"g7","no":7,"p":"～にあたっ 2,19]]],"au":["t/56bc9c918044","t/2b632771f0a6"]},{"id":"g75","no":75,"p":"～にしろ～にしろ","ctx":["（インタビューで）(Trong buổi phỏng vấn)"],"lines":[["A","社長として、社員に期待することは何でしょうか。","Với tư cách là Giám đốc, ông kỳ vọng điều gì ở nhân viên ạ?"],["B","新人にしろ、ベテランにしろ、それぞれ目標を持って仕事に取り組んでもらいたいと思っています。","Dù là người mới hay nhân viên kỳ cựu, tôi đều mong muốn mọi người nỗ lực làm việc với mục tiêu rõ ràng của riêng mình."]],"hit":[1,[[2,5],[10,13]]],"au":["t/b370d0a10e64","t/f6455b5c72ec"]},{"id":"g76","no":76,"p":"～てならない","ctx":[],"lines":[["A","今月いっぱいで辞める小山さん、X 社に転職するらしいですよ。","Anh Koyama hết tháng này nghỉ việc nghe nói sẽ chuyển sang công ty X đấy."],["B","あんなに有能なのに。残念でならないね。","Người tài năng như thế mà đi thì thật tiếc vô cùng."]],"hit":[1,[[12,17]]],"au":["t/bd3eae46df55","t/95de5ca2d95d"]},{"id":"g77","no":77,"p":"～といったら","ctx":[],"lines":[["A","てっきり次の部長は伊藤さんだと思ってたのに。鈴木さんと聞いた時の驚きといったら……。","Tôi cứ đinh ninh Trưởng phòng tiếp theo sẽ là anh Ito. Sự ngạc nhiên khi nghe tên anh Suzuki lúc đó thật là... không tả xiết."],["B","本当に。私もびっくりしました。","Đúng thật. Tôi cũng hết sức bất ngờ."]],"hit":[0,[[34,39]]],"au":["t/209f54dcc88b","t/f02f71f0341f"]},{"id":"g78","no":78,"p":"～ことはない","ctx":[],"lines":[["A","さっき、課長に言われたことだけど、気にすることはないですよ。課長は誰にでも厳しいんです。","Những lời trưởng phòng nói ban nãy, anh không cần phải bận tâm đâu. Trưởng phòng nghiêm khắc với tất cả mọi người mà."],["B","ありがとうございます……。","Cảm ơn cậu"]],"hit":[0,[[21,26]]],"au":["t/2270390fd8d6","t/0573b995fae6"]},{"id":"g79","no":79,"p":"～にしても","ctx":[],"lines":[["A","もう11 時ですよ。木村さん、もう来ないんじゃないですか。","Đã 11 giờ rồi. Chắc anh Kimura không đến nữa đâu nhỉ."],["B","いや、今晩は同期の送別会だから来ると思うけど……。それにしても遅いなあ。","Không, tối nay là tiệc chia tay đồng nghiệp cùng khóa nên tôi nghĩ anh ấy sẽ đến thôi... Cơ mà dù thế thì cũng trễ quá rồi."]],"hit":[1,[[27,31]]],"au":["t/e730ddb15c74","t/751d37b5fedb"]},{"id":"g80","no":80,"p":"～ことに","ctx":[],"lines":[["A","新人の山下さん、あきれたことに「今日休みます」と絵文字を付けて課長にメールしてきたらしいよ。","Cậu Yamashita mới vào làm, đến là cạn lời/ngán ngẩm, ng も","ctx":[],"lines":[["A","運転手さん、2 時までに駅に着きますか。","Bác tài ơi, liệu có đến ga trước 2 giờ được không?"],["B","いやあ、急いで行ったとしても無理でしょうね。","Chà, dẫu có đi gấp gáp đi nữa thì e là cũng không kịp đâu."]],"hit":[1,[[10,14]]],"au":["t/b232c19e4bd3","t/953910776ae2"]},{"id":"g87","no":87,"p":"～ものなら","ctx":[],"lines":[["A","毎日毎日、ノルマがきついよなあ。戻れるものなら、自由だった学生時代に戻りたいよなあ。","Ngày nào chỉ tiêu doanh số cũng căng thẳng quá. Nếu có thể quay lại được, tôi thật sự muốn quay về thời sinh viên tự do tự tại."],["B","同感ですね。","Tôi cũng đồng quan điểm."]],"hit":[0,[[19,23]]],"au":["t/c61a7ddfc5c8","t/422785778b79"]},{"id":"g88","no":88,"p":"～だの～だの","ctx":[],"lines":[["A","隣の課の赤木さんは、トイレで会うと、毎日忙しいだの、大変だの、愚痴ばかり言うんですよね。","Anh Akagi bên phòng cạnh bên, cứ hễ gặp ở nhà vệ sinh là ngày nào cũng toàn cằn nhằn than vãn nào là bận rộn, nào là vất vả."],["B","誰かに聞いてほしいんだよ。","Chắc anh ấy chỉ muốn tìm người trút bầu tâm sự thôi."]],"hit":[0,[[23,25],[28,30]]],"au":["t/f11e8dfa9898","t/4df6a7fed947"]},{"id":"g89","no":89,"p":"～ようがない","ctx":[],"lines":[["A","今回の課長の出張先は山奥で、電波が届かないらしいですよ。","Chuyến công tác lần này của Trưởng phòng là ở vùng sâu trong núi, nghe nói không có sóng điện thoại đâu."],["B","それじゃ、何かあっても連絡のしようがないじゃないですか。","Thế thì nếu có xảy ra việc gì cũng chẳng có cách nào liên lạc được còn gì."]],"hit":[1,[[15,20]]],"au":["t/6984d295b132","t/1ff0cda542d5"]},{"id":"g90","no":90,"p":"～よりほかない","ctx":[],"lines":[["A","昨夜はまいった。終電に乗り損ねてタクシーで帰るよりほかなかったよ。","Tối qua chán thật. Bị lỡ chuyến tàu cuối nên chẳng còn cách nào khác ngoài việc đi taxi về."],["B","千葉じゃあ、けっこう、料金かかったでしょう。大変でしたね。","Về tận Chiba thì tốn kha khá tiền đấy nhỉ. Vất vả cho anh quá."]],"hit":[0,[[23,31]]],"au":["t/81e1bb054c1c","t/ab088d34fced"]},{"id":"g91","no":91,"p":"～に際して","ctx":[],"lines":[["A","X 社と合併するに際して、社名を変更することが検討されているらしいですよ。","Nghe nói nhân dịp sáp nhập với công ty X, việc đổi tên công ty đang được đưa ra xem xét đấy."],["B","へえ、そうなの。何だか寂しいね。","Thế à. Tự dưng thấy hơi bùi ngùi/tiếc nuối nhỉ."]],"hit":[0,[[8,12]]],"au":["t/2bfdf2852574","t/db00701a1e08"]},{"id":"g92","no":92,"p":"～こと","ctx":[],"lines":[["A","中山さんの転職の条件は何ですか。","Tiêu chí chuyển việc của anh Nakayama là gì vậy?"],["B","そうだな。まず、何と言っても、今の年収を維持すること。それから、勤務地が首都圏であることかな。","Xem nào. Trước hết, quan trọng nhất là phải duy trì được mức thu nhập hiện tại. Sau đó là địa điểm làm việc phải ở khu vực thủ đô Tokyo."]],"hit":[1,[[24,26]]],"au":["t/ac41b4024b1f","t/8163516cd4c1"]},{"id":"g93","no":93,"p":"～とか","ctx":[],"lines":[["A","聞いた？ 日本支社が閉鎖されて、シンガポール支社に統合されるとか。","Nghe tin gì chưa? Nghe bảo chi nhánh Nhật Bản sẽ đóng cửa và sáp nhập vào chi nhánh Singapore đấy."],["B","そうらしいですね。私たちもシンガポールに行くんですかね。","Nghe đâu là vậy. Không biết chúng ta có phải chuyển sang Singapore không nhỉ."]],"hit":[0,[[30,32]]],"au":["t/b9c857bdecc1","t/d42e82c404cb"]},{"id":"g94","no":94,"p":"～しかない","ctx":[],"lines":[["A","部長がX 社の値引きに応じましたね。","Trưởng phòng đã đồng ý giảm giá cho công ty X rồi nhỉ."],["B","大切な取引先だから、受け入れるしかなかったんだろうな。","Vì là đối tác quan trọng nên chắc cũng chỉ còn cách chấp nhận thôi."]],"hit":[1,[[15,21]]],"au":["t/57d027ae723b","t/49973637afa7"]},{"id":"g95","no":95,"p":"～もの","ctx":[],"lines":[["A","デパート、ずいぶん混んでますね。","Trung tâm thương mại đông đúc ghê nhỉ."],["B","うん。クリスマス前だもんね。","Ừ. Thì sắp đến Giáng sinh rồi mà."]],"hit":[1,[[10,12]]],"au":["t/c7d4544835db","t/09acbbaeba34"]},{"id":"g96","no":96,"p":"～までして","ctx":[],"lines":[["A","松田さん、ポルシェ買ったのはいいけど、ローンが大変でお昼代も切り詰めているみたいですよ。","Anh Matsuda mua xe Porsche thì oách thật đấy, nhưng tiền trả góp nặng quá nên đến tiền ăn trưa cũng phải thắt lưng buộc bụng kìa."],["B","借金までしてポルシェを買いたいとは思わないよなあ。","Đến mức phải vay nợ để mua Porsche thì tôi cũng chẳng ham."]],"hit":[1,[[2,6]]],"au":["t/56dc9bcaf38d","t/753953118722"]},{"id":"g97","no":97,"p":"～一方だ","ctx":[],"lines":[["A","少子化で、労働力は減る一方です。人手不足の解消には、AI を活用した施策を早急に検討すべきでしょう。","Do tỷ lệ sinh giảm, lực lượng lao động ngày càng giảm sút. Để giải quyết tình trạng thiếu nhân lực, chúng ta nên nhanh chóng xem xét các phương án ứng dụng AI."],["B","話はわかりました。まずは企業 const DATA_AUDIO = {};
/* ===================== modules ===================== */
const MODULES = {};

/* ---------------- Từ vựng ---------------- */
if(MODULE==='vocab'){
  const hasKanji = s => /[一-鿿々]/.test(s);
  const isKata = s => /^[゠-ヿー・Ａ-Ｚa-zA-Z0-9\s]+$/.test(s);
  const forms = w => { const out=[]; const m=w.match(/^(.*?)（(.*?)）(.*)$/);
    if(m){ out.push(m[1]+m[3]); out.push(m[2]); } else out.push(w);
    return out.map(s=>s.replace(/[～〜~]/g,'').trim()).filter(Boolean); };
  const mainForm = w => forms(w)[0];
  const shortMeaning = m => { let s=m.split(/[:：·]/)[0].trim();
    if(s.length>70) s=s.replace(/\s*\(.*?\)\s*/g,' ').trim();
    if(s.length>70) s=s.slice(0,68).replace(/[,\s]+\S*$/,'')+'…';
    return s.replace(/[.。]+$/,''); };
  const wordClass = w => { const f=mainForm(w); if(isKata(f)) return 'kata'; if(/[ぁ-ん]$/.test(f)) return 'kana-end'; return 'kanji'; };
  const findIn = v => { for(const ex of v.ex) for(const f of forms(v.w).sort((a,b)=>b.length-a.length)){ const i=ex[0].indexOf(f); if(i>=0) return {ex,i,f,k:v.ex.indexOf(ex)}; } return null; };
  const hitHTML = (hit,tag) => { const s=hit.ex[0]; return esc(s.slice(0,hit.i))+`<${tag}>`+esc(hit.f)+`</${tag}>`+esc(s.slice(hit.i+hit.f.length)); };

  // reading distractors: near-miss kana (voicing, っ, long vowels, ょ/ゅ, ん)
  const VOICE = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ','た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
  const UNVOICE = Object.fromEntries(Object.entries(VOICE).map(([a,b])=>[b,a]));
  Object.assign(UNVOICE,{'ぱ':'は','ぴ':'ひ','ぷ':'ふ','ぺ':'へ','ぽ':'ほ'});
  const HPMAP = {'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ','ば':'ぱ','び':'ぴ','ぶ':'ぷ','べ':'ぺ','ぼ':'ぽ'};
  const OROW = 'おこごそぞとどのほぼぽもよろょ', SOKU = 'かきくけこさしすせそたちつてとぱぴぷぺぽ';
  const mutations = r => { const out=new Set(); const ch=[...r];
    ch.forEach((c,i)=>{
      const rep = x => { const a=ch.slice(); a[i]=x; out.add(a.join('')); };
      const del = () => { const a=ch.slice(); a.splice(i,1); out.add(a.join('')); };
      if(VOICE[c]) rep(VOICE[c]); if(UNVOICE[c]) rep(UNVOICE[c]); if(HPMAP[c]) rep(HPMAP[c]);
      if(c==='っ'){ del(); rep('つ'); }
      if(c==='ょ') rep('ゅ'); if(c==='ゅ') rep('ょ');
      if(c==='う' && i>0 && OROW.includes(ch[i-1])) del();
      if(c==='い' && i>0 && 'えけげせぜてでねへべめれ'.includes(ch[i-1])) del();
      if(c==='ん' && i>0) del();
      if(i>0 && SOKU.includes(c) && ch[i-1]!=='っ' && ch[i-1]!=='ん'){ const a=ch.slice(); a.splice(i,0,'っ'); out.add(a.join('')); }
      if(OROW.includes(c) && ch[i+1]!=='う' && ch[i+1]!=='ょ'){ const a=ch.slice(); a.splice(i+1,0,'う'); out.add(a.join('')); }
    });
    out.delete(r); return [...out].filter(s=>!/^[っんー]/.test(s)); };
  const readingOptions = v => { const r=v.r; let pool=shuffle(mutations(r));
    if(pool.length<3) pool=pool.concat(shuffle(pool.flatMap(mutations)).filter(x=>x!==r));
    let res=pickN(pool,3,[r]);
    if(res.length<3) res=res.concat(pickN(DATA.filter(o=>o.r && /^[ぁ-ん]+$/.test(o.r) && Math.abs(o.r.length-r.length)<=1).map(o=>o.r),3-res.length,[r,...res]));
    return res; };
  const others = (v,pool,n,key,filter) => { let c=pickN(pool.filter(o=>o.id!==v.id&&(!filter||filter(o))).map(key),n,[key(v)]);
    if(c.length<n) c=c.concat(pickN(DATA.filter(o=>o.id!==v.id&&(!filter||filter(o))).map(key),n-c.length,[key(v),...c])); return c; };

  const lessons=[...new Set(DATA.map(v=>v.l))].sort((a,b)=>a-b);
  MODULES.vocab = {
    key:'vocab', name:'Từ vựng', title:'Ôn tập từ vựng', quizTitle:'Kiểm tra từ vựng', unit:'từ',
    items: DATA,
    groupTitle:'Chọn bài', groupSub:'Mỗi lượt 20 câu, lấy từ các bài đã chọn. Thanh xanh = tỉ lệ từ đã trả lời đúng ít nhất 1 lần.',
    groups: lessons.map(l=>({k:String(l), label:String(l)})),
    groupOf: v => String(v.l),
    quick:[['all','Chọn tất cả'],['none','Bỏ chọn'],['1-15','Bài 1–15'],['16-30','Bài 16–30'],['31-45','Bài 31–45']],
    select: k => k==='all'?lessons.map(String):k==='none'?[]:(([a,b])=>lessons.filter(l=>l>=a&&l<=b).map(String))(k.split('-').map(Number)),
    types:[
      {k:'doc',  label:'Cách đọc · 漢字読み', name:'Cách đọc', desc:'Chọn cách đọc đúng của từ Kanji'},
      {k:'nghia',label:'Ý nghĩa · 意味', name:'Ý nghĩa', desc:'Từ tiếng Nhật → nghĩa tiếng Việt'},
      {k:'tu',   label:'Chọn từ · 語彙', name:'Chọn từ', desc:'Nghĩa tiếng Việt → từ tiếng Nhật'},
      {k:'dien', label:'Điền từ · 文脈規定', name:'Điền vào câu', desc:'Chọn từ hợp với chỗ trống trong câu'},
    ],
    canDo(t,v){
      if(t==='doc') return !!v.r && /^[ぁ-んー]+$/.test(v.r) && hasKanji(v.w);

      if(t==='dien') return !!v.m && !!findIn(v);

    },
    build(t,v,pool){
      if(t==='doc'){
        const hit=findIn(v);

          stem: hit?`<div class="sent jp">${hitHTML(hit,'u')}</div>`:`<div class="bigword jp"><u>${esc(mainForm(v.w))}</u></div>`,
          options: shuffle([{t:v.r,ok:true},...readingOptions(v).map(x=>({t:x,ok:false}))])};
      }
      if(t==='nghia'){
        const hit=findIn(v), cls=wordClass(v.w);
        return {ask:'Từ sau có nghĩa là gì?', optClass:'vi',
          stem:`<div class="bigword jp">${esc(v.w.replace(/（.*?）/,''))}</div>`+(hit?`<div class="sent jp sub">${hitHTML(hit,'u')}</div>`:''),
          options: shuffle([{t:shortMeaning(v.m),ok:true},...others(v,pool,3,o=>o.m&&shortMeaning(o.m),o=>!!o.m&&wordClass(o.w)===cls).map(x=>({t:x,ok:false}))])};
      }
      if(t==='tu'){
        const cls=wordClass(v.w);
        return {ask:'Từ nào mang nghĩa sau?',
          stem:`<div class="bigvi">${esc(shortMeaning(v.m))}</div>`+(v.en?`<div class="hint">EN: ${esc(v.en)}</div>`:''),
          options: shuffle([{t:mainForm(v.w),ok:true},...others(v,pool,3,o=>mainForm(o.w),o=>wordClass(o.w)===cls).map(x=>({t:x,ok:false}))])};
      }
      const hit=findIn(v), cls=wordClass(hit.f), s=hit.ex[0];
      return {ask:'Chọn từ thích hợp điền vào chỗ trống.',
        stem:`<div class="sent jp">${esc(s.slice(0,hit.i))}<span class="blank">&emsp;&emsp;</span>${esc(s.slice(hit.i+hit.f.length))}</div>`,
        options: shuffle([{t:hit.f,ok:true},...others(v,pool,3,o=>mainForm(o.w),o=>wordClass(o.w)===cls&&!s.includes(mainForm(o.w))).map(x=>({t:x,ok:false}))])};
    },
    explain(q,v,right){
      const ex=v.ex.map((e,k)=>`<div class="ex"><div class="j jp">${esc(e[0])} ${spk(e[0],`e/${v.id}-${k}`)}</div><div class="v">${esc(e[1])}</div></div>`).join('');
      return `<div class="explain ${right?'':'wrong'}">
        <div class="w jp">${esc(v.w)}${v.r?`<small>「${esc(v.r)}」</small>`:''}${spk(v.r||mainForm(v.w),'w/'+v.id)}</div>
        <div class="m">${esc(v.m||'')}${v.s?' <span class="en">(～する)</span>':''}</div>
        <div class="en">${esc(v.en||'')} · Bài ${v.l}</div>${ex}</div>`;
    },
    summary: v => ({title:`${esc(v.w)}${v.r?`<small>「${esc(v.r)}」</small>`:''}`, sub:`${esc(shortMeaning(v.m||''))} · Bài ${v.l}`}),
    autoplay: (q,v) => ({text:v.r||mainForm(v.w), key:'w/'+v.id}),
  };
}

/* ---------------- Ngữ pháp ---------------- */
if(MODULE==='grammar'){
  const SIZE=20;
  const groups=[]; for(let a=1;a<=DATA.length;a+=SIZE){ const b=Math.min(a+SIZE-1,DATA.length); groups.push({k:`${a}-${b}`,label:`${a}–${b}`}); }
  const groupOf = v => groups.find(g=>{ const [a,b]=g.k.split('-').map(Number); return v.no>=a&&v.no<=b; }).k;
  const frags = p => p.replace(/^（.*?）/,'').replace(/（.*?）|\(.*?\)/g,'～').split(/[～〜…]|・・・/).map(x=>x.trim()).filter(Boolean);
  const fits = (p, line) => { let pos=0; for(const f of frags(p)){ const i=line.indexOf(f,pos); if(i<0) return false; pos=i+f.length; } return true; };
  const lineHTML = (v, li, mode) => { // mode: 'blank' | 'mark' | 'plain'
    const s=v.lines[li][1]; if(mode==='plain'||!v.hit||v.hit[0]!==li) return esc(s);
    let out='', pos=0;
    for(const [a,b] of v.hit[1]){ out+=esc(s.slice(pos,a)) + (mode==='blank'?'<span class="blank">&emsp;&emsp;</span>':`<mark>${esc(s.slice(a,b))}</mark>`); pos=b; }
    return out+esc(s.slice(pos)); };
  const dialog = (v, mode, withTr, audio) =>
    (v.ctx.length?`<div class="ctx">${v.ctx.map(esc).join(' ')}</div>`:'') +
    `<div class="dlg">${v.lines.map((l,li)=>`<div class="ln ${v.hit&&v.hit[0]===li?'focus':''}"><span class="spk">${esc(l[0])}</span><div>
      <div class="jp">${lineHTML(v,li,mode)}${audio?' '+spk(l[1],v.au&&v.au[li]):''}</div>
      <div class="tr ${withTr?'':'hidden'}">${esc(l[2])}</div></div></div>`).join('')}</div>`;
  MODULES.grammar = {
    key:'grammar', name:'Ngữ pháp', title:'Ôn tập ngữ pháp', quizTitle:'Kiểm tra ngữ pháp', unit:'mẫu',
    items: DATA,
    groupTitle:'Chọn nhóm mẫu', groupSub:'117 mẫu ngữ pháp BJT J3~J2 thường gặp, chia nhóm 20 mẫu. Mỗi lượt tối đa 20 câu.',
    groups, groupOf, wideGroups:true,
    quick:[['all','Chọn tất cả'],['none','Bỏ chọn']],
    select: k => k==='all'?groups.map(g=>g.k):[],
    types:[{k:'dien', label:'Ngữ pháp · 文法', name:'Điền mẫu ngữ pháp', desc:'Chọn mẫu ngữ pháp hợp với chỗ trống trong hội thoại'}],
    canDo: (t,v) => !!v.hit,
    build(t,v,pool){
      const line=v.lines[v.hit[0]][1];
      const pick = list => pickN(list.filter(o=>o.id!==v.id && !fits(o.p,line)).map(o=>o.p),3,[v.p]);
      let d=pick(pool); if(d.length<3) d=d.concat(pickN(DATA.filter(o=>o.id!==v.id&&!fits(o.p,line)).map(o=>o.p),3-d.length,[v.p,...d]));
      return {ask:'Chọn mẫu ngữ pháp thích hợp điền vào chỗ trống.',
        stem: dialog(v,'blank',false,false) + `<button class="mini" data-reveal>Gợi ý: xem bản dịch</button>`,
        options: shuffle([{t:v.p,ok:true},...d.map(x=>({t:x,ok:false}))])};
    },
    explain(q,v,right){
      return `<div class="explain ${right?'':'wrong'}"><div class="w jp">${esc(v.p)} <small>Mẫu ${v.no}</small></div>
        <div class="ex">${dialog(v,'mark',true,true)}</div></div>`;
    },
    summary: v => ({title:esc(v.p), sub:`Mẫu ${v.no} · ${esc(v.lines[v.hit?v.hit[0]:0][2])}`}),
    autoplay: (q,v) => v.hit && v.au ? {text:v.lines[v.hit[0]][1], key:v.au[v.hit[0]]} : null,
  };
}

/* ---------------- Kính ngữ ---------------- */
if(MODULE==='keigo'){
  const KIND = {verb:'Động từ', biz:'Từ ngữ công sở', err:'Lỗi thường gặp'};
  const verbs = DATA.filter(v=>v.kind==='verb');
  const allSon = verbs.flatMap(v=>v.son), allKen = verbs.flatMap(v=>v.ken);
  const exclusive = v => [...v.son.filter(f=>!v.ken.includes(f)).map(f=>[f,'son']), ...v.ken.filter(f=>!v.son.includes(f)).map(f=>[f,'ken'])];
  // a form counts as 尊敬語 / 謙譲語 everywhere it appears in the table, so classify only forms that are unambiguous
  const isOnly = (f,kind) => kind==='son' ? allSon.includes(f)&&!allKen.includes(f) : allKen.includes(f)&&!allSon.includes(f);
  const LBL = {son:'尊敬語 (Tôn kính ngữ)', ken:'謙譲語 (Khiêm nhường ngữ)', tei:'丁寧語 (Lịch sự ngữ)'};
  const au = t => (DATA_AUDIO[t]||null);
  const verbTable = v => `<table class="kt"><tr><th>Thể thường</th><td class="jp">${esc(v.b)}</td></tr>
      <tr><th>尊敬語<br><small>Tôn kính</small></th><td class="jp">${v.son.map(f=>`${esc(f)}${spk(f,au(f))}`).join('<br>')||'—'}</td></tr>
      <tr><th>謙譲語<br><small>Khiêm nhường</small></th><td class="jp">${v.ken.map(f=>`${esc(f)}${spk(f,au(f))}`).join('<br>')||'—'}</td></tr>
      <tr><th>丁寧語<br><small>Lịch sự</small></th><td class="jp">${v.tei.map(esc).join('、')}</td></tr></table>`;
  MODULES.keigo = {
    key:'keigo', name:'Kính ngữ', title:'Ôn tập kính ngữ', quizTitle:'Kiểm tra kính ngữ', unit:'mục',
    items: DATA,
    groupTitle:'Chọn phần', groupSub:'Theo bảng chia động từ kính ngữ. Mỗi lượt tối đa 20 câu.',
    groups: Object.entries(KIND).map(([k,l])=>({k,label:l})), groupOf: v=>v.kind, wideGroups:true,
    quick:[['all','Chọn tất cả'],['none','Bỏ chọn']],
    select: k => k==='all'?Object.keys(KIND):[],
    types:[
      {k:'son', label:'尊敬語 · Tôn kính ngữ', name:'Tôn kính ngữ', desc:'Chọn dạng tôn kính của động từ'},
      {k:'ken', label:'謙譲語 · Khiêm nhường ngữ', name:'Khiêm nhường ngữ', desc:'Chọn dạng khiêm nhường của động từ'},
      {k:'loai',label:'Phân loại kính ngữ', name:'Phân loại', desc:'Dạng này là tôn kính hay khiêm nhường?'},
      {k:'goc', label:'Động từ gốc', name:'Động từ gốc', desc:'Kính ngữ này của động từ nào?'},
      {k:'biz', label:'Từ ngữ công sở · ビジネス用語', name:'Từ ngữ công sở', desc:'Cách nói trang trọng trong công việc'},
      {k:'err', label:'Sửa lỗi kính ngữ', name:'Sửa lỗi', desc:'Chọn cách nói đúng'},
    ],
    canDo(t,v){
      if(v.kind==='verb'){
        if(t==='son') return v.son.length>0;
        if(t==='ken') return v.ken.length>0;
        if(t==='loai') return exclusive(v).some(([f,k])=>isOnly(f,k));
        if(t==='goc') return v.son.concat(v.ken).some(f=>verbs.filter(o=>o.son.includes(f)||o.ken.includes(f)).length===1);
        return false;
      }
      return t===v.kind;
    },
    build(t,v,pool){
      if(t==='son'||t==='ken'){
        // distractors are forms of the other kind only, so exactly one option is a valid 尊敬語/謙譲語
        const right=v[t], other=t==='son'?'ken':'son', sameKind=t==='son'?allSon:allKen;
        const traps=pickN(v[other].filter(f=>!sameKind.includes(f)),2,[]);
        const rest=pickN(verbs.flatMap(o=>o[other]).filter(f=>!sameKind.includes(f)),3-traps.length,traps);
        return {ask:`Chọn dạng ${t==='son'?'尊敬語 (tôn kính ngữ)':'謙譲語 (khiêm nhường ngữ)'} của động từ sau.`,
          stem:`<div class="bigword jp">${esc(v.b)}</div>`,
          options: shuffle([{t:right[Math.random()*right.length|0],ok:true},...traps.concat(rest).map(x=>({t:x,ok:false}))])};
      }
      if(t==='loai'){
        const [f,k]=shuffle(exclusive(v).filter(([f,k])=>isOnly(f,k)))[0];
        return {ask:'Dạng sau thuộc loại kính ngữ nào?', optClass:'vi', form:f,
          stem:`<div class="bigword jp">${esc(f)}</div>`,
          options:['son','ken','tei'].map(x=>({t:LBL[x],ok:x===k}))};
      }
      if(t==='goc'){
        const f=shuffle(v.son.concat(v.ken).filter(f=>verbs.filter(o=>o.son.includes(f)||o.ken.includes(f)).length===1))[0];
        const d=pickN(verbs.filter(o=>!o.son.includes(f)&&!o.ken.includes(f)).map(o=>o.b),3,[v.b]);
        return {ask:'Đây là kính ngữ của động từ nào?', form:f,
          stem:`<div class="bigword jp">${esc(f)}</div>`,
          options: shuffle([{t:v.b,ok:true},...d.map(x=>({t:x,ok:false}))])};
      }
      if(t==='biz'){
        const d=pickN(DATA.filter(o=>o.kind==='biz'&&o!==v).map(o=>o.biz),3,[v.biz]);
        return {ask:'Trong công việc, cách nói trang trọng của từ sau là gì?',
          stem:`<div class="bigword jp">${esc(v.plain)}</div>`,
          options: shuffle([{t:v.biz,ok:true},...d.map(x=>({t:x,ok:false}))])};
      }
      return {ask:'Câu sau dùng kính ngữ sai. Chọn cách nói đúng.', optClass:'jp long',
        stem:`<div class="sent jp"><s>${esc(v.wrong)}</s></div>`,
        options: shuffle([{t:v.right,ok:true},...v.dis.filter(x=>x!==v.wrong).map(x=>({t:x,ok:false}))])};
    },
    explain(q,v,right){
      let body='';
      if(v.kind==='verb') body=(q.form?`<div class="m jp">${esc(q.form)} ${spk(q.form,au(q.form))}</div>`:'')+verbTable(v)+(v.note?`<div class="en">${esc(v.note)}</div>`:'');
      if(v.kind==='biz') body=`<div class="m jp">${esc(v.plain)} → <b>${esc(v.biz)}</b> ${spk(v.say,au(v.say))}</div>`;
      if(v.kind==='err') body=`<div class="m jp">❌ <s>${esc(v.wrong)}</s></div><div class="m jp">⭕ <b>${esc(v.right)}</b> ${spk(v.right.replace(/（.*?）/,''),au(v.right.replace(/（.*?）/,'')))}</div><div class="en" style="font-size:14px">${esc(v.note)}</div>`;
      return `<div class="explain ${right?'':'wrong'}">${body}</div>`;
    },
    summary: v => v.kind==='verb' ? {title:esc(v.b), sub:`尊敬語: ${esc(v.son.join('、')||'—')} · 謙譲語: ${esc(v.ken.join('、')||'—')}`}
                : v.kind==='biz' ? {title:`${esc(v.plain)} → ${esc(v.biz)}`, sub:KIND.biz}
                : {title:esc(v.right), sub:`Sai: ${esc(v.wrong)}`},
    autoplay(q,v){
      const ok=q.options.find(o=>o.ok).t;
      if(v.kind==='verb'){ const f=q.form||ok; return {text:f,key:au(f)}; }
      if(v.kind==='biz') return {text:v.say,key:au(v.say)};
      const r=v.right.replace(/（.*?）/,''); return {text:r,key:au(r)};
    },
  };
}
/* ===================== shared engine ===================== */
const N_Q = 20;
const MODES = [{k:'weak',label:'Ưu tiên câu yếu'},{k:'rand',label:'Ngẫu nhiên'},{k:'order',label:'Theo thứ tự'}];

const store = {
  get(k,d){ try{ const v=localStorage.getItem('bjtvocab:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('bjtvocab:'+k, JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pickN = (list, n, exclude) => { const seen=new Set(exclude); const out=[]; for(const x of shuffle(list)){ if(out.length>=n) break; if(!x||seen.has(x)) continue; seen.add(x); out.push(x);} return out; };

const M = MODULES[MODULE];
const ITEMS = M.items;
const byId = Object.fromEntries(ITEMS.map(v=>[v.id,v]));
let stats = store.get('stats', {});
let prefs = Object.assign({groups:[M.groups[0].k], types:M.types.map(t=>t.k), mode:'weak', instant:true, order:{}},
                          store.get('prefs:'+M.key, {}));
prefs.groups = prefs.groups.filter(g=>M.groups.some(x=>x.k===g));
prefs.types = prefs.types.filter(t=>M.types.some(x=>x.k===t));
if(!prefs.types.length) prefs.types=M.types.map(t=>t.k);
const savePrefs = () => store.set('prefs:'+M.key, prefs);

/* ---------- audio: pre-recorded Tokyo voice (ja-JP-NanamiNeural) in audio/, browser voice as fallback ---------- */
const player = new Audio();
function speakTTS(text){
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='ja-JP'; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
}
function say(text, key){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(!key){ speakTTS(text); return; }
  player.onerror=()=>speakTTS(text);
  player.src='audio/'+key+'.mp3';
  player.play().catch(err=>{ if(err.name!=='AbortError' && err.name!=='NotAllowedError') speakTTS(text); });
}
const spk = (text, key) => `<button class="speak" data-say="${esc(text)}"${key?` data-audio="${esc(key)}"`:''} title="Nghe">🔊</button>`;

/* ---------- session ---------- */
let S=null, timerId=null;
const poolFor = groups => ITEMS.filter(v=>groups.includes(M.groupOf(v)));
function chooseItems(pool, types, mode){
  const usable=pool.filter(v=>types.some(t=>M.canDo(t,v)));
  if(mode==='order'){
    const key=prefs.groups.slice().sort().join(',');
    let start=(prefs.order&&prefs.order[key])||0;
    if(start>=usable.length) start=0;
    const pick=usable.slice(start,start+N_Q);
    if(pick.length<N_Q) pick.push(...usable.slice(0,Math.min(N_Q,usable.length)-pick.length));
    prefs.order=prefs.order||{}; prefs.order[key]=start+N_Q>=usable.length?0:start+N_Q; savePrefs();
    return pick;
  }
  if(mode==='weak'){
    const score=v=>{ const s=stats[v.id]; if(!s) return 1000+Math.random()*100;
      const days=(Date.now()-(s.t||0))/864e5;
      return s.w*40 - s.c*15 + Math.min(days,30)*2 + Math.random()*25; };
    return usable.map(v=>[score(v),v]).sort((a,b)=>b[0]-a[0]).slice(0,N_Q).map(x=>x[1]);
  }
  return shuffle(usable).slice(0,N_Q);
}
function startSession(items){
  const pool=poolFor(prefs.groups);
  const types=prefs.types;
  const qs=shuffle(items).map((v,i)=>{
    const ok=types.filter(t=>M.canDo(t,v));
    const pref=types[i%types.length];
    const t= ok.includes(pref) ? pref : ok[Math.random()*ok.length|0];
    return Object.assign(M.build(t,v,pool), {type:t, id:v.id});
  });
  S={qs, ans:Array(qs.length).fill(null), cur:0, start:Date.now(), done:false, instant:prefs.instant};
  show('quiz'); render();
  clearInterval(timerId); timerId=setInterval(tick,1000); tick();
}
function tick(){
  if(!S) return;
  const sec=Math.floor(((S.end||Date.now())-S.start)/1000);
  $('#timer').textContent=String(sec/60|0).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
}
const locked = i => S.done || (S.instant && S.ans[i]!==null);
const typeOf = k => M.types.find(t=>t.k===k);
function render(){
  const q=S.qs[S.cur], i=S.cur;
  $('#nav').innerHTML=S.qs.map((qq,k)=>{
    let c='dot'; if(k===i) c+=' cur';
    if(S.ans[k]!==null){ if(locked(k)) c+= qq.options[S.ans[k]].ok?' ok':' bad'; else c+=' ans'; }
    return `<button class="${c}" data-go="${k}">${k+1}</button>`;
  }).join('');
  const curDot=$('#nav').children[i]; if(curDot) curDot.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  $('#qn').textContent=`Câu ${i+1}/${S.qs.length}`;
  $('#qtype').textContent=typeOf(q.type).label;
  $('#ask').textContent=q.ask;
  const lk=locked(i);
  $('#stem').innerHTML=q.stem;
  $('#stem').classList.toggle('answered', lk);
  $('#opts').innerHTML=q.options.map((o,k)=>{
    let c='opt';
    if(lk){ if(o.ok) c+=' ok'; else if(S.ans[i]===k) c+=' bad'; }
    else if(S.ans[i]===k) c+=' sel';
    return `<button class="${c}" data-opt="${k}" ${lk?'disabled':''}><span class="n">${k+1}</span><span class="t ${q.optClass||'jp'}">${esc(o.t)}</span></button>`;
  }).join('');
  $('#explain').innerHTML = lk ? M.explain(q, byId[q.id], S.ans[i]!==null && q.options[S.ans[i]].ok) : '';
  $('#cnt').textContent=`${i+1}/${S.qs.length}`;
  $('#prevBtn').disabled = i===0;
  const last = i===S.qs.length-1;
  $('#nextBtn').innerHTML = S.done ? (last?'Xem kết quả':'Next &nbsp;›') : (last?'Nộp bài':'Next &nbsp;›');
}
function choose(k){
  const i=S.cur; if(locked(i) || k>=S.qs[i].options.length) return;
  S.ans[i]=k;
  if(S.instant) record(S.qs[i], k);
  render();
}
function record(q,k){
  const s=stats[q.id]||{c:0,w:0,t:0};
  if(q.options[k].ok) s.c++; else s.w++;
  s.t=Date.now(); stats[q.id]=s; store.set('stats',stats);
}
function go(i){ if(!S||i<0||i>=S.qs.length) return; S.cur=i; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function next(){
  if(S.cur<S.qs.length-1) return go(S.cur+1);
  if(S.done) return showResult();
  const blank=S.ans.filter(a=>a===null).length;
  if(blank && !confirm(`Còn ${blank} câu chưa trả lời. Nộp bài luôn?`)) return;
  finish();
}
function finish(){
  if(!S.instant) S.qs.forEach((q,i)=>{ if(S.ans[i]!==null) record(q,S.ans[i]); });
  S.done=true; S.end=Date.now(); clearInterval(timerId); tick();
  showResult();
}
let rFilter='all';
function showResult(){
  show('result');
  const total=S.qs.length, ok=S.qs.filter((q,i)=>S.ans[i]!==null&&q.options[S.ans[i]].ok).length;
  const pct=Math.round(ok/total*100);
  const sec=Math.floor((S.end-S.start)/1000);
  const C=2*Math.PI*52;
  $('#scoreBox').innerHTML=`
    <svg class="ring" viewBox="0 0 130 130"><circle cx="65" cy="65" r="52" fill="none" stroke="var(--line-2)" stroke-width="12"/>
    <circle cx="65" cy="65" r="52" fill="none" stroke="${pct>=80?'var(--ok)':pct>=50?'var(--ink)':'var(--bad)'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 65 65)"/>
    <text x="65" y="72" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)">${ok}/${total}</text></svg>
    <div><h2>${pct>=80?'Tuyệt vời!':pct>=50?'Khá ổn!':'Cố gắng thêm nhé!'}</h2>
    <p>Đúng ${ok} / ${total} câu (${pct}%) · Thời gian ${sec/60|0} phút ${sec%60} giây</p>
    <p style="font-size:13px;color:var(--muted)">Bấm vào từng câu bên dưới để xem lại.</p></div>`;
  $('#retryWrong').disabled = ok===total;
  $('#rfilters').innerHTML=[['all','Tất cả'],['bad','Câu sai'],['ok','Câu đúng']].map(([k,l])=>`<button class="pill ${rFilter===k?'on':''}" data-rf="${k}">${l}</button>`).join('');
  $('#rlist').innerHTML=S.qs.map((q,i)=>{
    const v=byId[q.id]; const a=S.ans[i]; const good=a!==null&&q.options[a].ok;
    if(rFilter==='bad'&&good) return ''; if(rFilter==='ok'&&!good) return '';
    const sm=M.summary(v);
    return `<div class="ritem" data-review="${i}"><span class="mk ${good?'ok':'bad'}">${good?'✓':'✗'}</span>
      <div><div class="w jp">${sm.title}</div>
      <div class="m">${sm.sub} · <span style="color:var(--muted)">${typeOf(q.type).name}</span></div>
      ${good?'':`<div class="yours">Bạn chọn: ${a===null?'(bỏ trống)':esc(q.options[a].t)} → Đáp án: ${esc(q.options.find(o=>o.ok).t)}</div>`}</div></div>`;
  }).join('') || '<p class="stat">Không có câu nào.</p>';
}

/* ---------- setup ---------- */
function show(id){
  ['setup','quiz','result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));
  $('#bottom').classList.toggle('hidden', id!=='quiz');
  $('#title').textContent = id==='setup'?M.title:id==='quiz'?M.quizTitle:'Kết quả';
  window.scrollTo(0,0);
}
function renderSetup(){
  $('#groupTitle').textContent=M.groupTitle;
  $('#groupSub').textContent=M.groupSub;
  $('#quick').innerHTML=M.quick.map(([k,l])=>`<button class="mini" data-sel="${k}">${l}</button>`).join('');
  $('#lessons').className = M.wideGroups ? 'lessons wide' : 'lessons';
  $('#lessons').innerHTML=M.groups.map(g=>{
    const ws=ITEMS.filter(v=>M.groupOf(v)===g.k); const known=ws.filter(v=>stats[v.id]&&stats[v.id].c>0).length;
    return `<button class="lchip ${prefs.groups.includes(g.k)?'on':''}" data-l="${g.k}"><b>${g.label}</b><small>${known}/${ws.length}</small><div class="bar"><i style="width:${known/ws.length*100}%"></i></div></button>`;
  }).join('');
  $('#types').innerHTML=M.types.map(t=>`<button class="tcard ${prefs.types.includes(t.k)?'on':''}" data-t="${t.k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('');
  $('#modes').innerHTML=MODES.map(m=>`<button class="pill ${prefs.mode===m.k?'on':''}" data-m="${m.k}">${m.label}</button>`).join('');
  $('#instant').checked=prefs.instant;
  const pool=poolFor(prefs.groups).filter(v=>prefs.types.some(t=>M.canDo(t,v)));
  const seen=pool.filter(v=>stats[v.id]).length, weak=pool.filter(v=>stats[v.id]&&stats[v.id].w>stats[v.id].c).length;
  $('#poolStat').innerHTML=`<b>${pool.length}</b> ${M.unit} · đã ôn <b>${seen}</b> · hay sai <b>${weak}</b>`;
  $('#startBtn').textContent=`Bắt đầu ${Math.min(N_Q,pool.length)} câu`;
  $('#startBtn').disabled = pool.length<1 || !prefs.types.length;
  savePrefs();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-review]'); if(!t) return;
  const d=t.dataset;
  if(d.l!==undefined){ const l=d.l; prefs.groups=prefs.groups.includes(l)?prefs.groups.filter(x=>x!==l):[...prefs.groups,l]; renderSetup(); }
  else if(d.sel){ prefs.groups = M.select(d.sel); renderSetup(); }
  else if(d.t){ prefs.types=prefs.types.includes(d.t)?prefs.types.filter(x=>x!==d.t):[...prefs.types,d.t]; renderSetup(); }
  else if(d.m){ prefs.mode=d.m; renderSetup(); }
  else if(d.go!==undefined){ go(+d.go); }
  else if(d.opt!==undefined){ choose(+d.opt); }
  else if(d.say){ say(d.say, d.audio); }
  else if(d.reveal!==undefined){ document.querySelectorAll('#stem .tr').forEach(x=>x.classList.remove('hidden')); t.remove(); }
  else if(d.rf){ rFilter=d.rf; showResult(); }
  else if(d.review!==undefined){ show('quiz'); go(+d.review); }
});
$('#instant').addEventListener('change',e=>{ prefs.instant=e.target.checked; savePrefs(); });
$('#startBtn').onclick=()=>startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode));
$('#prevBtn').onclick=()=>go(S.cur-1);
$('#nextBtn').onclick=next;
$('#newRound').onclick=()=>{ rFilter='all'; startSession(chooseItems(poolFor(prefs.groups),prefs.types,prefs.mode)); };
$('#retryWrong').onclick=()=>{ rFilter='all'; startSession(S.qs.filter((q,i)=>!(S.ans[i]!==null&&q.options[S.ans[i]].ok)).map(q=>byId[q.id])); };
$('#toSetup').onclick=()=>{ renderSetup(); show('setup'); };
$('#backBtn').onclick=()=>{
  if(!$('#setup').classList.contains('hidden')){ location.href='index.html'; return; }
  if(!$('#quiz').classList.contains('hidden') && S && !S.done && S.ans.some(a=>a!==null) && !confirm('Thoát bài đang làm?')) return;
  clearInterval(timerId); renderSetup(); show('setup');
};
$('#resetBtn').onclick=()=>{
  if(!confirm(`Xoá lịch sử ôn tập phần ${M.name} trên trình duyệt này?`)) return;
  for(const v of ITEMS) delete stats[v.id];
  store.set('stats',stats); renderSetup();
};
$('#themeBtn').onclick=()=>{
  const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark?'light':'dark'; store.set('theme',r.dataset.theme);
};
document.addEventListener('keydown',e=>{
  if($('#quiz').classList.contains('hidden')||!S) return;
  if(e.target.tagName==='INPUT') return;
  if(/^[1-9]$/.test(e.key)) choose(+e.key-1);
  else if(e.key==='ArrowRight'||e.key==='Enter') next();
  else if(e.key==='ArrowLeft') go(S.cur-1);
});
document.title = M.title + ' BJT';
renderSetup();

</script>
</body>
</html>
